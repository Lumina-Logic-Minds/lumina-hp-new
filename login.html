<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administrator — Lumina Logic Minds</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#03070b" />

  <link rel="icon" type="image/png" href="assets/models/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=Shippori+Mincho:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/admin.css" />

  <!-- Three.js for the planets.glb space background -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script src="js/back-link.js" defer></script>
  <script src="js/config.js"></script>
</head>
<body>
  <div class="bg-fx" aria-hidden="true"></div>
  <canvas id="space-bg" aria-hidden="true"></canvas>
  <div id="enter-flash" aria-hidden="true"></div>

  <main class="auth-wrap">
    <!-- is-locked: パスワード欄と LOG IN を伏せた初期状態。
         隠しコマンド（WITNESS）の完了で解錠される。 -->
    <form class="auth-card auth-card--hud is-locked" id="login-form" autocomplete="off">
      <span class="hud-corner tl" aria-hidden="true"></span>
      <span class="hud-corner tr" aria-hidden="true"></span>
      <span class="hud-corner bl" aria-hidden="true"></span>
      <span class="hud-corner br" aria-hidden="true"></span>
      <span class="hud-scan" aria-hidden="true"></span>
      <p class="auth-eyebrow">▸ Restricted Access</p>
      <h1 class="auth-title">ADMINISTRATOR</h1>

      <div class="auth-field">
        <!-- このラベルは隠さないこと。隠しコマンド "WITNESS" の W は、
             ページ内でここ（Password）にしか存在しない。 -->
        <label for="password">Password</label>
        <p class="auth-lock" aria-hidden="true">— ACCESS LOCKED —</p>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>

      <button type="submit" class="auth-btn">LOG IN</button>
      <p class="auth-error" id="err" hidden>パスワードが違います。</p>

      <a class="auth-back" href="index.html" data-back="login">← サイトへ戻る</a>
    </form>
  </main>

  <script type="module" src="js/login.js"></script>

  <script>
    // fade out the surface-break flash carried over from the ascension
    window.addEventListener("load", () => {
      const flash = document.getElementById("enter-flash");
      requestAnimationFrame(() => flash.classList.add("gone"));
      setTimeout(() => flash.remove(), 1300);
    });

    // パスワードは Apps Script 側のスクリプトプロパティに置き、照合もサーバーで行う。
    // ここに書くと閲覧者全員に見えてしまうため（以前はここに平文で置いていた）。
    const API_URL = window.LLM_API_URL; // 認証エンドポイント（切り替えは js/config.js）
    const form = document.getElementById("login-form");
    const err = document.getElementById("err");
    const pwEl = document.getElementById("password");
    const btn = form.querySelector(".auth-btn");

    function showError(msg) {
      err.textContent = msg;
      err.hidden = false;
      const card = document.querySelector(".auth-card");
      card.classList.remove("shake");
      void card.offsetWidth; // restart the animation
      card.classList.add("shake");
      pwEl.select();
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (form.classList.contains("is-locked")) return; // 解錠前は送信しない

      err.hidden = true;
      btn.disabled = true;
      const btnLabel = btn.textContent;
      btn.textContent = "AUTHENTICATING...";

      try {
        // Content-Type を text/plain にするとプリフライト(OPTIONS)が発生しないため、
        // Apps Script から応答を読み取れる。application/json だと CORS で失敗する。
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "login", password: pwEl.value }),
        });
        const data = await res.json();
        if (data && data.success && data.token) {
          sessionStorage.setItem("adminToken", data.token);
          window.location.href = "admin.html";
          return; // 遷移するのでボタンは戻さない
        }
        showError((data && data.error) || "パスワードが違います。");
      } catch (netErr) {
        console.error("認証エラー:", netErr);
        showError("通信に失敗しました。時間をおいて再度お試しください。");
      }

      btn.disabled = false;
      btn.textContent = btnLabel;
    });

    // ---- hidden "WITNESS" route: click the letters W-I-T-N-E-S-S in order
    // (case-insensitive; a used letter can't be reused) across the card text ----
    (function () {
      const SEQ = "WITNESS";
      const targets = [
        document.querySelector(".auth-eyebrow"),
        document.querySelector(".auth-title"),
        document.querySelector('label[for="password"]'),
      ].filter(Boolean);

      const letters = [];
      targets.forEach((el) => {
        const text = el.textContent;
        el.textContent = "";
        for (const ch of text) {
          if (/[a-z]/i.test(ch)) {
            const s = document.createElement("span");
            s.className = "wletter";
            s.textContent = ch;
            el.appendChild(s);
            letters.push(s);
          } else {
            el.appendChild(document.createTextNode(ch));
          }
        }
      });

      let idx = 0;
      const used = [];
      const reset = () => { idx = 0; used.forEach((s) => s.classList.remove("wlit")); used.length = 0; };

      letters.forEach((s) => {
        s.addEventListener("click", (e) => {
          e.preventDefault();
          if (s.classList.contains("wlit")) return; // already used
          if (s.textContent.toUpperCase() === SEQ[idx]) {
            s.classList.add("wlit");
            used.push(s);
            idx++;
            if (idx === SEQ.length) {
              // completion action: letters flip cyan -> gold in a wave, the card flares,
              // and the password field is revealed. The password itself is still required —
              // this route unlocks the form, it does not bypass authentication.
              used.forEach((el, i) => {
                setTimeout(() => { el.classList.remove("wlit"); el.classList.add("wdone"); }, i * 150);
              });
              document.querySelector(".auth-card").classList.add("auth-card--unlocked");
              setTimeout(() => {
                form.classList.remove("is-locked");
                pwEl.focus();
              }, SEQ.length * 150 + 250); // 文字の波が流れ切ってから
            }
          } else {
            reset(); // wrong letter -> back to the initial state
          }
        });
      });
    })();
  </script>
</body>
</html>
